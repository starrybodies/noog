<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NOOG store promo tile</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
      }
      body {
        background: #171c16;
        color: #e5eddd;
        font-family: Arial, sans-serif;
      }
      .tile {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 40px;
        background: radial-gradient(
          ellipse at 95% 95%,
          #304126 0,
          transparent 65%
        );
      }
      .brand {
        width: 245px;
        height: auto;
        position: relative;
        z-index: 1;
      }
      .tagline {
        font-size: 22px;
        line-height: 1.3;
        font-weight: 500;
        letter-spacing: -0.3px;
        margin: 27px 0 0;
        position: relative;
        z-index: 1;
      }
      .ring {
        position: absolute;
        border: 2px solid #b5ed55;
        border-radius: 50%;
        width: 128px;
        height: 210px;
        right: -45px;
        top: 41px;
        transform: rotate(-15deg);
        opacity: 0.3;
      }
      .ring.second {
        right: 18px;
        top: 111px;
        width: 95px;
        height: 152px;
        opacity: 0.16;
      }
      .accent {
        width: 30px;
        height: 3px;
        background: #c4f265;
        margin-top: 26px;
      }
    </style>
  </head>
  <body>
    <main class="tile">
      <img
        class="brand"
        src="../../public/assets/noog-wordmark.png"
        alt="NOOG"
      />
      <p class="tagline">Your feed.<br />Your choice.</p>
      <div class="accent"></div>
      <div class="ring"></div>
      <div class="ring second"></div>
    </main>
  </body>
</html>
